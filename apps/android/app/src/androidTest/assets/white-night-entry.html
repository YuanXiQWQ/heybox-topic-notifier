<!doctype html>
<html lang="en-US">
<meta charset="utf-8">
<script>
// 记录原始媒体身份，释放 src 后再次调用 play 也不能漏报。
window.entryProbe = 'pending';
window.entryRecords = [];
window.entryAudios = [];
const NativeAudio = Audio;
window.Audio = class extends NativeAudio {
  constructor(src) {
    super(src);
    this.entrySource = src;
    entryAudios.push(this);
    this.addEventListener('playing', () => {
      if (!this.muted) entryRecords.push({event: 'playing', src, at: performance.now()});
    });
  }
  play() {
    if (!this.muted) entryRecords.push({event: 'play', src: this.entrySource, at: performance.now()});
    if (window.entryTransformation && this.entrySource.endsWith('Lucifer_standbg0.ogg')) {
      window.entryCleanup = entryAudios.filter((audio) =>
        audio !== this && audio.entrySource.includes('/creature/deathangel/'))
        .map((audio) => ({src: audio.entrySource, paused: audio.paused, released: !audio.getAttribute('src')}));
    }
    return super.play();
  }
};
</script>
<script type="module">
try {
  sessionStorage.clear();
  localStorage.clear();
  if (window.entryTransformation) {
    sessionStorage.setItem('warmnest.lobotomy-corp-plague-doctor', JSON.stringify({
      apostles: Array.from({length: 12}, (_, index) => 'Apostle ' + index),
      recording: true, transformed: false,
    }));
  }
  const root = '/static/fun/lobotomy-corp/';
  for (const [id, path] of [
    ['lobotomy-corp-locale-data', 'Locales/en-US.json'],
    ['lobotomy-corp-abnormalities-data', 'Data/Abnormalities.json'],
  ]) {
    const data = document.createElement('script');
    data.id = id;
    data.type = 'application/json';
    data.textContent = await (await fetch(root + path)).text();
    document.head.append(data);
  }
  await import(root + 'lobotomy-corp.js');
  const api = window.lobotomyCorpEasterEgg;
  const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  if (window.entryTransformation) {
    void api.commitDisplayName('O-01-45');
    const deadline = performance.now() + 75000;
    while (api.getSpecialEventPhase() !== 'active' && performance.now() < deadline) await wait(100);
    await wait(500);
    const whispers = entryAudios.filter((audio) => audio.entrySource.includes('Lucifer_Apostle_Whisper'));
    const church = entryAudios.find((audio) => audio.entrySource.endsWith('Lucifer_standbg0.ogg'));
    const result = {phase: api.getSpecialEventPhase(), whispers: whispers.length,
      whisperPlayed: entryRecords.some(({event, src}) => event === 'playing' && src.includes('Lucifer_Apostle_Whisper')),
      cleanup: window.entryCleanup, churchPosition: church?.currentTime};
    console.log('PLAGUE_DOCTOR_PROBE ' + JSON.stringify(result));
    if (result.phase !== 'active' || whispers.length !== 11 || !result.whisperPlayed ||
        !result.cleanup?.length || !result.cleanup.every(({paused, released}) => paused && released) ||
        !(church?.currentTime > 0) || church.paused) throw new Error(JSON.stringify(result));
  } else {
  if (window.entryPrepared) {
    const prepared = api.prepareDisplayName('T-03-46');
    await wait(100);
    void prepared.commit();
  } else {
    void api.commitDisplayName('T-03-46');
  }
  await wait(1500);
  const first = entryAudios.find((audio) => audio.entrySource.endsWith('emergency01_mast.ogg'));
  const prelude = {phase: api.getSpecialEventPhase(), firstPosition: first?.currentTime,
    firstPlaying: first && !first.muted && !first.paused};
  await wait(5000);
  const bells = entryRecords.filter(({src}) => src.endsWith('Lucifer_Bell0.ogg'));
  const calls = bells.filter(({event}) => event === 'play').length;
  const playing = bells.filter(({event}) => event === 'playing').length;
  const church = entryAudios.find((audio) => audio.entrySource.endsWith('Lucifer_standbg0.ogg'));
  const third = entryAudios.find((audio) => audio.entrySource.endsWith('emergency03_mast.ogg') &&
    !audio.muted && !audio.paused && audio.currentTime > 0);
  const result = {prepared: window.entryPrepared, phase: api.getSpecialEventPhase(), calls, playing,
    churchPosition: church?.currentTime, thirdPosition: third?.currentTime, bells, prelude};
  console.log('WHITE_NIGHT_PROBE ' + JSON.stringify(result));
  if (result.phase !== 'active' || calls !== 1 || playing !== 1 ||
      !(church?.currentTime > 0) || church.paused ||
      prelude.phase !== 'prelude' || !prelude.firstPlaying || !(prelude.firstPosition > 0) ||
      !(third?.currentTime > 0) || third.muted || third.paused) {
    throw new Error(JSON.stringify(result));
  }
  }
  window.entryProbe = 'passed';
} catch (error) {
  window.entryProbe = String(error);
}
</script>
</html>
