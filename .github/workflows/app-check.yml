# 普通变更验证原生构建和全部彩蛋资源；正式发行另由 app-build.yml 使用发行签名。
name: Check Windows and Android applications
on:
  push:
    branches: [main, dev]
    paths: [
      "apps/**",
      "static/**",
      "src/favicon.ts",
      ".github/workflows/app-*.yml",
    ]
  pull_request:
    paths: [
      "apps/**",
      "static/**",
      "src/favicon.ts",
      ".github/workflows/app-*.yml",
    ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: app-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Test and build unsigned verification installer
        working-directory: apps/desktop
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci --no-audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify all packaged resources
        run: node apps/scripts/verify-assets.mjs apps/desktop/dist/win-unpacked/resources/static
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # 明确指定 SDK 36 与 AGP 8.13 所需工具，避免依赖隐式安装列表。
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Test, lint and build debug APK
        run: |
          node apps/scripts/prepare-assets.mjs --android
          gradle -p apps/android --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Verify all packaged resources
        run: |
          unzip -q apps/android/app/build/outputs/apk/debug/app-debug.apk 'assets/static/*' -d "$RUNNER_TEMP/android-package"
          node apps/scripts/verify-assets.mjs "$RUNNER_TEMP/android-package/assets/static"
