# 手动构建应用安装包；上传构建产物，不自动发布或覆盖 GitHub Release。
name: Build Windows and Android applications
on:
  workflow_dispatch:
    inputs:
      version:
        description: '正式三段版本，例如 0.1.0'
        required: true
        default: '0.1.0'
      version_code:
        description: 'Android 单调递增版本号'
        required: true
        default: '1'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Validate release inputs
        shell: pwsh
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          if ($env:APP_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version' }
      - name: Build signed installer
        working-directory: apps/desktop
        shell: pwsh
        env:
          APP_VERSION: ${{ inputs.version }}
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          WIN_PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME }}
        run: |
          if (!$env:CSC_LINK -or !$env:WIN_PUBLISHER_NAME) { throw 'Windows signing configuration is required' }
          npm ci --no-audit
          npm version $env:APP_VERSION --no-git-tag-version
          npm test
          npm run prepare:assets
          npx electron-builder --win nsis --x64 --publish never --config.forceCodeSigning=true --config.win.publisherName="$env:WIN_PUBLISHER_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest.yml
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build signed APK
        env:
          APP_VERSION: ${{ inputs.version }}
          APP_VERSION_CODE: ${{ inputs.version_code }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          HONOR_PUSH_APP_ID: ${{ vars.HONOR_PUSH_APP_ID }}
        run: |
          [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "$APP_VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || exit 1
          (( APP_VERSION_CODE <= 2100000000 )) || exit 1
          test -n "$ANDROID_KEYSTORE_BASE64"
          export ANDROID_KEYSTORE="$RUNNER_TEMP/application-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE"
          node apps/scripts/prepare-assets.mjs --android
          gradle -p apps/android --no-daemon testDebugUnitTest lintRelease assembleRelease
          cp apps/android/app/build/outputs/apk/release/app-release.apk heybox-topic-notifier-android-universal.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: heybox-topic-notifier-android-universal.apk
