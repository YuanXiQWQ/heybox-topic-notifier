# 正式版本标签自动构建完整应用发行；手动运行可补发已有标签。
name: Build Windows and Android applications
on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*", "v[0-9]*.[0-9]*.[0-9]*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "已有发行标签，例如 3.8.2（也支持 v3.8.2）"
        required: true
        type: string
      upload:
        description: "上传到该标签的 Release（不存在则创建草稿）；关闭时仅保存构建产物"
        type: boolean
        default: false
      publish:
        description: "上传完成后公开草稿 Release（需要同时开启 upload）"
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: app-release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event_name != 'release' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      version_code: ${{ steps.release.outputs.version_code }}
      commit: ${{ steps.release.outputs.commit }}
      upload: ${{ steps.release.outputs.upload }}
      release_id: ${{ steps.release.outputs.release_id }}
      complete: ${{ steps.release.outputs.complete }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Resolve release tag and immutable source revision
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
          UPLOAD_RELEASE: ${{ github.event_name != 'workflow_dispatch' || inputs.upload }}
          RELEASE_ID: ${{ github.event.release.id }}
          GH_TOKEN: ${{ github.token }}
        run: deno run --allow-env --allow-read --allow-write --allow-run=git --allow-net=api.github.com scripts/app_release.ts prepare
  check:
    needs: prepare
    if: needs.prepare.outputs.complete != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task check
  windows:
    needs: [prepare, check]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Build Windows installer without a certificate requirement
        working-directory: apps/desktop
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci --no-audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm version $env:APP_VERSION --no-git-tag-version --allow-same-version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run prepare:assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx electron-builder --win nsis --x64 --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify all packaged resources
        run: node apps/scripts/verify-assets.mjs apps/desktop/dist/win-unpacked/resources/static
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            apps/desktop/dist/heybox-topic-notifier-windows-x64-setup.exe
            apps/desktop/dist/heybox-topic-notifier-windows-x64-setup.exe.blockmap
            apps/desktop/dist/latest.yml
  android:
    needs: [prepare, check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # 明确指定 SDK 36 与 AGP 8.13 所需工具，避免依赖隐式安装列表。
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build signed APK
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          APP_VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          HONOR_PUSH_APP_ID: ${{ vars.HONOR_PUSH_APP_ID }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD secret}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD secret}"
          export ANDROID_KEYSTORE="$RUNNER_TEMP/application-release.jks"
          trap 'rm -f -- "$ANDROID_KEYSTORE"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE"
          node apps/scripts/prepare-assets.mjs --android
          gradle -p apps/android --no-daemon testDebugUnitTest lintRelease assembleRelease
          cp apps/android/app/build/outputs/apk/release/app-release.apk heybox-topic-notifier-android-universal.apk
      - name: Verify all packaged resources
        run: |
          unzip -q heybox-topic-notifier-android-universal.apk 'assets/static/*' -d "$RUNNER_TEMP/android-package"
          node apps/scripts/verify-assets.mjs "$RUNNER_TEMP/android-package/assets/static"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          if-no-files-found: error
          path: heybox-topic-notifier-android-universal.apk
  publish:
    needs: [prepare, check, windows, android]
    if: needs.prepare.outputs.upload == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 使用本次工作流的发行脚本，允许为已有标签补发安装包。
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release-assets
      - name: Verify and upload installers, then publish the updater manifest
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          PUBLISH_DRAFT: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
          GH_TOKEN: ${{ github.token }}
        run: deno run --allow-env --allow-read --allow-net=api.github.com,uploads.github.com scripts/app_release.ts publish release-assets
